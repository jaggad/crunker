name: Release

# Publishing a GitHub release stages the same version on npm. npm trusts this
# workflow directly (trusted publishing), so no npm token exists anywhere, and
# every version carries a provenance statement linking it to this commit. The
# trust relationship only allows staging, so a version goes public only once a
# maintainer approves it with 2FA.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  YARN_ENABLE_SCRIPTS: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "${version}" ]; then
            echo "release tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0

      - name: Run tests
        run: yarn run test

      # staged publishing needs npm 12, newer than the one Node 22 ships.
      - name: Update npm
        run: npm install -g npm@12

      - name: Build
        run: yarn run build

      - name: Stage for publishing
        run: npm stage publish
